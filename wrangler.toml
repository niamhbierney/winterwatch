name = "winterwatch"
main = "worker.js"
compatibility_date = "2026-11-19"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/*", "/api/*"]

[vars]
OPENAI_MODEL = "gpt-4.1-mini"
# Set these two values to your Cloudflare Zero Trust team domain and Access application's AUD tag.
ACCESS_TEAM_DOMAIN = "YOUR-TEAM-NAME.cloudflareaccess.com"
ACCESS_AUD = "YOUR-ACCESS-APPLICATION-AUD-TAG"
